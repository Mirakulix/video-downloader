[pytest]

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

asyncio_mode = auto

markers =
    unit: Unit-Tests
    integration: Integration-Tests
    performance: Performance-Tests
    security: Security-Tests
    e2e: End-to-End-Tests
    slow: Langsame Tests
    network: Tests die Netzwerk-Zugriff benoetigen
    docker: Tests die Docker benoetigen
    vpn: Tests die VPN-Funktionalitaet testen
    browser: Tests die Browser-Automatisierung verwenden
    cli: CLI-Interface-Tests
    smoke: Smoke-Tests

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

timeout = 300
