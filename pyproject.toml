[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-downloader"
version = "1.0.0"
description = "Async Python application for downloading videos from websites"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9.0",
    "yt-dlp>=2023.12.30",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "asyncio-throttle>=1.0.2",
    "aiofiles>=23.2.1",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "structlog>=23.2.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
]

[project.scripts]
video-downloader = "cli:cli"

[tool.setuptools]
py-modules = ["video_downloader", "utilities", "cli", "example_usage", "setup_env"]
